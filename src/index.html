<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentWatch</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark"></span>
        <span class="name">AgentWatch</span>
      </div>
      <div class="counts" id="counts"></div>
    </header>

    <section class="strip" id="strip" aria-label="Agents"></section>

    <main class="list" id="list"></main>

    <footer class="foot">
      <span id="providers"></span>
      <span class="hint">Hover a dot for its status and why.</span>
    </footer>
  </body>
</html>
