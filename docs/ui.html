<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AgentWatch — UI tour</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 40px 32px 80px;
    background: #0a0a0c; color: #f5f5f7;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: #98989d; margin: 0 0 40px; }
  figure { margin: 0 0 44px; }
  figure img {
    width: 100%; height: auto; display: block;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  figcaption { margin-top: 12px; color: #98989d; font-size: 13px; }
  figcaption b { color: #f5f5f7; font-weight: 600; display: block; margin-bottom: 3px; font-size: 13.5px; }
  code { background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AgentWatch — UI tour</h1>
  <p class="sub">The real frontend, rendered headless. Not mockups.</p>

  <figure>
    <img src="assets/ui-board.png" alt="The board" />
    <figcaption><b>1 · The board</b>
      One dot per agent, most urgent first. <b style="display:inline">Ring = vendor</b> (Claude clay, Codex teal, OpenCode amber, Gemini violet, Cursor grey). <b style="display:inline">Fill = status</b> (blue working, amber needs you, green done, red dead, dashed unknown).</figcaption>
  </figure>

  <figure>
    <img src="assets/ui-answering.png" alt="Answering" />
    <figcaption><b>2 · Answering</b>
      Three sessions need attention. Only the Claude Code row offers <code>1 Allow</code> / <code>2 Deny</code> — OpenCode has no hook, so its amber row can be seen but not answered. The limitation is shown, not hidden.</figcaption>
  </figure>

  <figure>
    <img src="assets/ui-light.png" alt="Light appearance" />
    <figcaption><b>3 · Light appearance</b>
      Status colours switch to Apple's light system colours. <code>#0a84ff</code> on white is ~2.1:1 contrast, so light mode uses <code>#0071e3</code>, <code>#a85600</code>, <code>#1a7f37</code>, <code>#d70015</code>.</figcaption>
  </figure>

  <figure>
    <img src="assets/ui-compact-pill.png" alt="Compact, pill dots, purple accent" />
    <figcaption><b>4 · Compact + pill + purple</b>
      Same data, <code>shape=pill</code>, <code>density=compact</code>, <code>accent=#bf5af2</code>. One attribute each; no layout is duplicated per theme.</figcaption>
  </figure>

  <figure>
    <img src="assets/ui-appearance.png" alt="Appearance drawer" />
    <figcaption><b>5 · Appearance drawer</b>
      Five controls, live preview, no Apply button.</figcaption>
  </figure>

  <figure>
    <img src="assets/ui-empty.png" alt="Empty state" />
    <figcaption><b>6 · Empty</b>
      No agents: the strip collapses and the board says what to start. An idle app should look calm, not broken.</figcaption>
  </figure>
</div>
</body>
</html>
